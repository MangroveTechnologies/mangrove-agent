name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  custody-security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Build isolated custody acceptance image
        run: docker build -f scripts/custody-security.Dockerfile -t mangrove-custody-security .
      - name: Verify real processes, OS users, signatures and adversarial requests
        run: docker run --rm --network none mangrove-custody-security

  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          # Lockfile pins pytest/pytest-asyncio/ruff too — CI tests exactly
          # what setup.sh and Docker install.
          pip install -r server/requirements.lock

      - name: Lint with ruff
        run: ruff check --config server/pyproject.toml server/src/

      - name: Verify the custody hashed lock against requirements.lock and PyPI wheel hashes
        run: python scripts/hash_custody_lock.py --verify

      - name: Lint custody administration and acceptance tests
        run: >-
          ruff check --config server/pyproject.toml
          scripts/custody-service.py scripts/custody-retire-legacy.py
          scripts/install-custody.py scripts/custody_security_e2e.py scripts/hash_custody_lock.py
          server/tests/unit/test_custody.py server/tests/unit/test_transaction_intent.py

      - name: Verify shared agent instructions and client launchers
        run: |
          python scripts/agent_context.py --check
          ruff check --config server/pyproject.toml scripts/agent_context.py scripts/client_session.py scripts/local_mcp_bridge.py scripts/wallet_secret_guard.py server/tests/unit/test_wallet_secret_guard.py server/tests/unit/test_agent_clients.py server/tests/unit/test_chat_launcher.py server/tests/unit/test_local_mcp_bridge.py

      - name: Lint payment demos and their tests
        run: >-
          ruff check --config server/pyproject.toml
          server/scripts/_x402_demo.py
          server/scripts/pay_hello_mangrove.py
          server/scripts/agent_pay_hello_mangrove.py
          server/scripts/agent_pay_hello_mangrove_mcp.py
          server/scripts/test_x402_mainnet.py
          server/tests/unit/test_x402_demo_scripts.py
          server/tests/unit/test_x402_payer.py
          server/tests/unit/test_fernet_read_safety.py

      - name: Verify strategy workflow remains server-owned
        run: python -m pytest server/tests/unit/test_server_owned_strategy.py -q

      - name: Lint MCP contract checks
        run: ruff check --config server/pyproject.toml scripts/mcp_contract.py server/tests/unit/test_mcp_contract.py

      - name: Lint installed SDK compatibility checks
        run: ruff check --config server/pyproject.toml server/tests/integration/test_installed_sdk_local_deployment.py

      # Offline: imports test config in an isolated child with networking,
      # database connections and writes blocked. No receiver credentials needed.
      - name: Verify MCP registration, schemas, pricing and adapter contracts
        run: python -B scripts/mcp_contract.py

      - name: Check setup flow
        run: |
          bash -n scripts/reveal-secret.sh scripts/confirm-backup.sh scripts/install-mac.sh scripts/setup.sh scripts/setup-mcp.sh scripts/verify_quickstart.sh
          ruff check --config server/pyproject.toml scripts/setup_support.py scripts/wallet_backup.py server/tests/unit/test_setup_flow.py

      - name: Run tests
        env:
          ENVIRONMENT: test
          MANGROVE_LOCAL_DEPLOYMENT_EXPECTED: present
        run: |
          # Runner home, /tmp and /opt can have writable ancestors. Create
          # only a disposable leaf directly under /, then verify the exact
          # hierarchy with unchanged production checks before the full suite.
          custody_test_root="$(sudo mktemp -d /mangrove-custody-unit.XXXXXX)"
          sudo chown "$(id -u):$(id -g)" "$custody_test_root"
          trap 'sudo rmdir -- "$custody_test_root"' EXIT
          stat --format='%A %a %U:%G %n' / "$custody_test_root"
          if command -v getfacl >/dev/null; then
            getfacl -p / "$custody_test_root"
          fi
          MANGROVE_CUSTODY_TEST_ROOT="$custody_test_root" PYTHONPATH=server python - <<'PY'
          import os
          from pathlib import Path
          from src.custody.transport import check_ancestors, check_owned_path
          root = Path(os.environ["MANGROVE_CUSTODY_TEST_ROOT"])
          check_owned_path(root, owner=os.getuid(), private=True)
          check_ancestors(root, allowed_owners={0, os.getuid()})
          print("Protected custody fixture hierarchy verified:", root)
          PY
          cd server
          MANGROVE_CUSTODY_TEST_ROOT="$custody_test_root" pytest tests/ -v
