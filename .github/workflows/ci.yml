name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          # Lockfile pins pytest/pytest-asyncio/ruff too — CI tests exactly
          # what setup.sh and Docker install.
          pip install -r server/requirements.lock

      - name: Lint with ruff
        run: ruff check server/src/

      # The synced Michael skills are generated from the private MangroveAI
      # repo, which CI cannot read. The generator records a sha256 per file in
      # skills-sync-manifest.json; this fails if a committed copy was
      # hand-edited or the manifest is stale.
      - name: Verify synced Michael skills match their manifest
        run: python scripts/sync-michael-skills.py --verify-manifest

      - name: Run tests
        env:
          ENVIRONMENT: test
        run: cd server && pytest tests/ -v
