name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          # Lockfile pins pytest/pytest-asyncio/ruff too — CI tests exactly
          # what setup.sh and Docker install.
          pip install -r server/requirements.lock

      - name: Lint with ruff
        run: ruff check --config server/pyproject.toml server/src/

      - name: Verify shared agent instructions and client launchers
        run: |
          python scripts/agent_context.py --check
          ruff check --config server/pyproject.toml scripts/agent_context.py scripts/client_session.py scripts/local_mcp_bridge.py server/tests/unit/test_agent_clients.py server/tests/unit/test_chat_launcher.py server/tests/unit/test_local_mcp_bridge.py

      - name: Lint payment demos and their tests
        run: >-
          ruff check --config server/pyproject.toml
          server/scripts/_x402_demo.py
          server/scripts/pay_hello_mangrove.py
          server/scripts/agent_pay_hello_mangrove.py
          server/scripts/agent_pay_hello_mangrove_mcp.py
          server/scripts/test_x402_mainnet.py
          server/tests/unit/test_x402_demo_scripts.py
          server/tests/unit/test_x402_payer.py
          server/tests/unit/test_fernet_read_safety.py

      - name: Verify strategy workflow remains server-owned
        run: python -m pytest server/tests/unit/test_server_owned_strategy.py -q

      - name: Lint MCP contract checks
        run: ruff check --config server/pyproject.toml scripts/mcp_contract.py server/tests/unit/test_mcp_contract.py

      # Offline: imports test config in an isolated child with networking,
      # database connections and writes blocked. No receiver credentials needed.
      - name: Verify MCP registration, schemas, pricing and adapter contracts
        run: python -B scripts/mcp_contract.py

      - name: Check setup flow
        run: |
          bash -n scripts/reveal-secret.sh scripts/confirm-backup.sh scripts/install-mac.sh scripts/setup.sh scripts/setup-mcp.sh scripts/verify_quickstart.sh
          ruff check --config server/pyproject.toml scripts/setup_support.py scripts/wallet_backup.py server/tests/unit/test_setup_flow.py

      - name: Run tests
        env:
          ENVIRONMENT: test
        run: cd server && pytest tests/ -v
