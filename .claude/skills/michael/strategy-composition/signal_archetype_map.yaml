# Signal -> strategy-archetype map (machine-readable).
# The classification rule, its sources and the reasoning behind each call are recorded in the
# signal-archetype-classification research note; this file is the decision, not the argument.
# Covers every signal the knowledge graph carries -- one row per signal, no row without a
# signal. A name here that the graph does not have is a rename the map missed, and a signal
# the graph has and this does not is refused at composition time, so the two are asserted
# equal by test rather than kept in step by hand.
#
# Per-signal fields:
#   arch : one of [trend_following, momentum, breakout, volatility, mean_reversion, any, none]
#          `any` belongs to no single archetype and is admissible in every regime that admits
#          anything; it never decides the strategy's archetype. `none` is a no-trade gate.
#   type : TRIGGER | FILTER   (from the KB docstring Type:)
#   role : entry_trigger | context_filter | confirmation | exit | no_trade_gate
#   cond : (optional) archetype depends on a param; resolve per-strategy from entry_json
#   flag : (optional) known ambiguity / naming issue -> lower confidence, see the doc
#
# NOTE (long-only): overbought oscillators are mean_reversion FAMILY but role=exit (fade the
# top is not a long entry). bearish/*_down/*_lower TRIGGER variants keep their archetype but
# are entries only for the SHORT side -> in this long-only book, role=exit for those.

rules:
  # applied AFTER per-signal lookup, over the strategy's {trigger, filters}
  primary_is_trigger: true
  momentum_trigger_plus_trend_context_filter: trend_following   # promote
  breakout_trigger_plus_compression_filter: breakout            # high-confidence
  mean_reversion_trigger_plus_strong_trend_filter: INCOHERENT   # flag, do not surface
  conditional_resolution:
    rsi_cross_up:   {threshold_le_35: mean_reversion, else: momentum}
    cmo_cross_up:   {threshold_le_neg20: mean_reversion, else: momentum}
    cmo_cross_down: {threshold_ge_20: mean_reversion, else: momentum}   # default thr +50 -> exit
    cci_oversold:   {default: mean_reversion, lambert_breakout_usage: trend_following}
    cci_overbought: {default: mean_reversion, lambert_breakout_usage: trend_following}

