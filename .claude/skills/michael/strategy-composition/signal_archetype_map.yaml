pattern:          # 40 signals -- candlestick and bar geometry
  # arch: any. A pattern is a statement about the last few bars, not about what kind of
  # strategy it belongs to: the same engulfing candle confirms a trend-following entry, a
  # breakout and a mean-reversion bounce. So a pattern is admissible in every regime that
  # admits anything, and it never decides the strategy's archetype -- whichever OTHER
  # signal is the trigger does. A pattern as the sole trigger leaves the archetype open.
